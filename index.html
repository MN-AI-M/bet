<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>9x9 SKILL TAC</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><link rel="stylesheet" href="style.css"></head><body><div id="screen-title" class="screen active"><div class="bg-board-container"><div id="bg-board" class="board"></div></div><div class="title-content"><h1 id="btn-text" class="mode-btn-text" >ベータ版</h1><div class="mode-select"> <button id="btn-pvp" class="mode-btn active" data-mode="pvp">2 PLAYER</button> <button id="btn-pve" class="mode-btn" data-mode="pve">VS BOT</button> </div> <button id="btn-start" class="start-btn">START</button> </div></div><div id="screen-game" class="screen"><header class="game-header"><div class="player-info player-1 active" id="p1-info"> <span class="p-symbol">〇</span><span class="p-name">Player 1</span> </div><div class="game-status"><div id="status-turn">Player 1 の番</div></div><div class="player-info player-2" id="p2-info"> <span class="p-symbol">✕</span><span class="p-name">Player 2</span> </div></header><main class="game-main"><div class="board-container"><div id="board" class="board"></div><div id="fog-overlay" class="fog-overlay hidden"></div></div><div class="hand-container"><div id="skills-list" class="skills-list"></div></div></main></div><div id="modal-result" class="modal hidden"><div class="modal-content"><h2 id="result-title">GAME OVER</h2><p id="result-message">Player 1 の勝利です！</p> <button id="btn-restart" class="action-btn primary">もう一度遊ぶ</button> <button id="btn-to-title" class="action-btn secondary">タイトルへ戻る</button> </div></div> <!-- チュートリアル用オーバーレイ -->
<div id="tutorial-overlay" class="tutorial-overlay hidden">
  <div class="tutorial-box">
    <p id="tutorial-text">チュートリアルメッセージ</p>
  </div>
</div><script src="app.js"></script></body></html>
