<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スキル五目並べ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 背景デモ対戦 -->
  <div id="bg-board-container">
    <div id="bg-board"></div>
  </div>

  <!-- タイトル画面 -->
  <div id="screen-title" class="screen active">
    <h1>スキル五目並べ</h1>
    <div class="mode-select">
      <button id="btn-pvp" class="btn active">2人プレイ (PvP)</button>
      <button id="btn-pve" class="btn">VS Bot (PvE)</button>
    </div>
    <button id="btn-start" class="btn btn-primary">ゲーム開始</button>
  </div>

  <!-- メインゲーム画面 -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <div id="p1-info" class="player-card">
        <span class="player-name">Player 1</span> (〇)
      </div>
      <div class="status-info">
        <div id="status-turn">Player 1 の番</div>
        <div id="status-phase">スキルを使うか、マスを選んで石を置いてください</div>
      </div>
      <div id="p2-info" class="player-card">
        <span class="player-name">Player 2</span> (✕)
      </div>
    </div>

    <!-- 盤面エリア -->
    <div class="board-wrapper">
      <div id="board"></div>
      <div id="fog-overlay" class="hidden"></div>
    </div>

    <!-- ボード下のスキルカード所持エリア -->
    <div class="hand-container">
      <div class="hand-label">手札（ドラッグして使用）</div>
      <div id="skills-list" class="skills-list"></div>
    </div>
  </div>

  <!-- リザルトモーダル -->
  <div id="modal-result" class="modal hidden">
    <div class="modal-content">
      <h2 id="result-title">GAME OVER</h2>
      <p id="result-message"></p>
      <div class="modal-buttons">
        <button id="btn-restart" class="btn btn-primary">もう一度</button>
        <button id="btn-to-title" class="btn">タイトルへ</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
