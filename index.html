<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9x9 SKILL TAC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- タイトル画面 -->
  <div id="screen-title" class="screen active">
    <div class="bg-board-container">
      <div id="bg-board" class="board"></div>
    </div>

    <div class="title-content">
      <div class="mode-select">
        <button id="btn-pvp" class="mode-btn active" data-mode="pvp">2 PLAYER</button>
        <button id="btn-pve" class="mode-btn" data-mode="pve">VS BOT</button>
      </div>
      <button id="btn-start" class="start-btn">START</button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="screen-game" class="screen">
    <header class="game-header">
      <div class="player-info player-1 active" id="p1-info">
        <span class="p-symbol">〇</span><span class="p-name">Player 1</span>
      </div>
      <div class="game-status">
        <div id="status-turn">Player 1 の番</div>
        <div id="status-phase" class="phase-badge">1. 石を置いてください</div>
      </div>
      <div class="player-info player-2" id="p2-info">
        <span class="p-symbol">✕</span><span class="p-name">Player 2</span>
      </div>
    </header>

    <main class="game-main">
      <div class="board-container">
        <div id="board" class="board"></div>
        <div id="fog-overlay" class="fog-overlay hidden"></div>
      </div>
    </main>
  </div>

  <!-- 【新UI】中央ポップアップ：獲得カード通知モーダル -->
  <div id="modal-get-card" class="modal-overlay hidden">
    <div id="get-card-content" class="get-card-card">
      <div class="card-badge">NEW SKILL</div>
      <div id="get-card-title" class="card-title-lg">スキル名</div>
      <div id="get-card-desc" class="card-desc-lg">効果の説明文がここに入ります</div>
      <div class="swipe-hint">スワイプして閉じる</div>
    </div>
  </div>

  <!-- 【新UI】中央ポップアップ：スキル発動・一覧モーダル -->
  <div id="modal-skills" class="modal-overlay hidden">
    <div class="skills-container">
      <div class="skills-header">
        <h3>使用するスキルを盤面にドラッグ</h3>
        <p>枠外をタップで「スキル不使用（ターン終了）」</p>
      </div>
      <div id="skills-list" class="skills-list">
        <!-- JSで所持カードがここに生成される -->
      </div>
      <button id="btn-skip-skill" class="action-btn secondary">スキルを使用しない</button>
    </div>
  </div>

  <!-- ドラッグ中に追従するクローン要素 -->
  <div id="drag-proxy" class="drag-proxy hidden"></div>

  <!-- リザルトモーダル -->
  <div id="modal-result" class="modal hidden">
    <div class="modal-content">
      <h2 id="result-title">GAME OVER</h2>
      <p id="result-message">Player 1 の勝利です！</p>
      <button id="btn-restart" class="action-btn primary">もう一度遊ぶ</button>
      <button id="btn-to-title" class="action-btn secondary">タイトルへ戻る</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
